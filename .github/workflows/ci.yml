name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff pip-audit pytest

      - name: Lint (ruff)
        # Non-blocking for now: the pre-existing engine has ~166 findings (mostly
        # E501 line-length in the bilingual interpretation tables). A dedicated
        # ruff-cleanup follow-up will make this blocking. New code should be clean.
        run: ruff check .
        continue-on-error: true

      - name: Security audit (pip-audit)
        # Non-blocking: transitive dependency vulns in a floating environment can
        # produce false positives we cannot immediately fix. Failures are visible
        # in the job summary but do not break CI.
        run: pip-audit
        continue-on-error: true

      - name: Test suite (pytest)
        run: pytest -q

  node:
    name: Node checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Syntax check
        run: npm run check

      - name: Web static tests
        run: npm run test:web
